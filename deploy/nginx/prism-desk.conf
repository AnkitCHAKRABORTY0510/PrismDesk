# Nginx site for Prism Desk on the lab workstation.
# Serves the built React app and proxies /api and /health to Uvicorn.
# Install: sudo cp deploy/nginx/prism-desk.conf /etc/nginx/sites-available/prism-desk
#          sudo ln -s /etc/nginx/sites-available/prism-desk /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name prismdesk.lab.local;
    # Redirect LAN clients to HTTPS so Secure session cookies work.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name prismdesk.lab.local;

    # Use a certificate trusted by lab machines (internal CA or mkcert).
    ssl_certificate     /etc/ssl/prism-desk/prism-desk.crt;
    ssl_certificate_key /etc/ssl/prism-desk/prism-desk.key;

    root /opt/prism-desk/frontend/dist;
    index index.html;

    # pdf.js (in-browser PDF metadata import) ships an ES module worker.
    include mime.types;
    types { application/javascript mjs; }

    # No uploads exist in Prism Desk; keep request bodies small.
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location ~ ^/(health|docs|redoc|openapi.json) {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single-page app: unknown paths load index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
