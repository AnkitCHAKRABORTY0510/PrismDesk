# Nginx site for Prism Desk over plain HTTP, for a first trial on the campus
# LAN before a certificate is set up. Prefer prism-desk.conf (HTTPS).
#
# With plain HTTP the session cookie travels unencrypted on the network, and
# the backend must NOT force Secure cookies. In backend/.env set
#   APP_ENV=development
#   COOKIE_SECURE=false
#   CORS_ORIGINS=http://10.150.51.90,http://prismdesk   FRONTEND_BASE_URL=http://10.150.51.90
# Switch to prism-desk.conf (and APP_ENV=production, COOKIE_SECURE=true,
# https:// origins) as soon as HTTPS is available.
#
# Install: sudo cp deploy/nginx/prism-desk-http-only.conf /etc/nginx/sites-available/prism-desk
#          sudo ln -s /etc/nginx/sites-available/prism-desk /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    # Campus IP (IITG Connect) and hostname; add a DNS name here if IITG assigns one.
    server_name 10.150.51.90 prismdesk;

    root /opt/prism-desk/frontend/dist;
    index index.html;

    # pdf.js (in-browser PDF metadata import) ships an ES module worker.
    include mime.types;
    types { application/javascript mjs; }

    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location ~ ^/(health|docs|redoc|openapi.json) {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
